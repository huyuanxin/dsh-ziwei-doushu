name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个发布任务，避免两次发布抢同一个版本号。
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Trusted Publishing 必需：用它换 OIDC 短期凭证，不再需要 NPM_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # 故意不配 cache：发布构建不缓存依赖，避免拿到脏的 node_modules。

      - run: npm ci
      - run: npm test
      - run: npm publish
